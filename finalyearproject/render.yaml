databases:
  - name: marketplace_db
    database_name: marketplace
    user: marketplace_user
    plan: free

services:
  - type: web
    name: campus-marketplace
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn finalyearproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace_db
          property: connectionString